<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1e293b; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .stats-bar { display: flex; gap: 20px; background: #1e293b; padding: 12px 20px; border-bottom: 1px solid #334155; font-size: 14px; }
        .stat-badge { background: #334155; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
        .main-container { flex: 1; display: flex; padding: 24px; justify-content: center; align-items: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 32px; border: 1px solid #334155; width: 100%; max-width: 480px; text-align: center; display: flex; flex-direction: column; gap: 20px; }
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; flex: 1; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-yellow { background: #eab308; color: #000; }
        .timer { font-size: 36px; font-weight: 700; color: #22c55e; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🟢 Agent Console</h1>
        <div id="statusText" style="font-weight: 600; color: #22c55e;">Status: IDLE</div>
    </div>

    <div class="stats-bar">
        <div>Customers Waiting: <span id="statWaiting" class="stat-badge">0</span></div>
        <div>Active Agents: <span id="statActiveAgents" class="stat-badge">0</span></div>
        <div>Idle Agents: <span id="statIdleAgents" class="stat-badge">0</span></div>
    </div>

    <div class="main-container">
        <div class="card" id="idleCard">
            <h2>Ready for Call</h2>
            <p style="color: #94a3b8;">Waiting for customer connection...</p>
        </div>

        <div class="card" id="callCard" style="display: none;">
            <h2>Active Customer Call</h2>
            <div id="phoneDisplay" style="color: #38bdf8; font-size: 18px; font-weight: 600;">Phone: --</div>
            <div class="timer" id="callTimer">00:00</div>
            <div style="display: flex; gap: 12px;">
                <button id="declineBtn" class="btn btn-yellow">Decline</button>
                <button id="endBtn" class="btn btn-red">End Call</button>
            </div>
        </div>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        const agentId = 'Agent-' + Math.floor(1000 + Math.random() * 9000);
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let pc = null;
        let timerInterval, seconds = 0;
        const rtcConfig = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'REGISTER_AGENT', agentId }));
        };

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'QUEUE_STATS') {
                document.getElementById('statWaiting').innerText = data.waitingCount;
                document.getElementById('statActiveAgents').innerText = data.activeAgents;
                document.getElementById('statIdleAgents').innerText = data.idleAgents;
            }
            else if (data.type === 'INCOMING_CALL') {
                document.getElementById('phoneDisplay').innerText = `Phone: ${data.phoneNumber}`;
                document.getElementById('idleCard').style.display = 'none';
                document.getElementById('callCard').style.display = 'flex';
                document.getElementById('statusText').innerText = 'Status: ON CALL';
                document.getElementById('statusText').style.color = '#ef4444';

                await setupWebRTC();
            }
            else if (data.type === 'offer') {
                if (!pc) await setupWebRTC();
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'answer', answer }));
            }
            else if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
            else if (data.type === 'HANGUP') {
                resetCall();
            }
        };

        async function setupWebRTC() {
            pc = new RTCPeerConnection(rtcConfig);
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => pc.addTrack(track, stream));
            } catch(e) {
                console.error("Microphone access error:", e);
            }

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                }
            };

            pc.ontrack = (e) => {
                const audio = document.getElementById('remoteAudio');
                audio.srcObject = e.streams[0];
                audio.play().catch(err => console.log('Audio autoplay unblocked on gesture'));
            };

            startTimer();
        }

        function startTimer() {
            seconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                document.getElementById('callTimer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function resetCall() {
            clearInterval(timerInterval);
            if (pc) { pc.close(); pc = null; }
            document.getElementById('callCard').style.display = 'none';
            document.getElementById('idleCard').style.display = 'flex';
            document.getElementById('statusText').innerText = 'Status: IDLE';
            document.getElementById('statusText').style.color = '#22c55e';
        }

        document.getElementById('declineBtn').onclick = () => {
            ws.send(JSON.stringify({ type: 'DECLINE' }));
            resetCall();
        };

        document.getElementById('endBtn').onclick = () => {
            ws.send(JSON.stringify({ type: 'HANGUP' }));
            resetCall();
        };
    </script>
</body>
</html>
