<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; height: 100vh; }
        .widget { position: fixed; bottom: 24px; right: 24px; width: 380px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #0f172a; color: #fff; padding: 20px; }
        .body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .btn { width: 100%; background: #0f172a; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-red { background: #ef4444; }
        .timer { font-size: 32px; font-weight: 700; color: #22c55e; margin: 10px 0; text-align: center; }
    </style>
</head>
<body>

    <div class="widget">
        <div class="header">
            <h3>Support Widget</h3>
            <p style="color: #94a3b8; font-size: 13px;">Talk to a live agent</p>
        </div>

        <div class="body" id="formView">
            <input type="tel" id="phoneInput" class="input" placeholder="Enter Phone Number..." />
            <button id="callBtn" class="btn">Start Voice Call</button>
        </div>

        <div class="body" id="callView" style="display: none; text-align: center;">
            <h4 id="statusText" style="color: #0f172a;">Connecting...</h4>
            <div class="timer" id="callTimer" style="display: none;">00:00</div>
            <button id="endBtn" class="btn btn-red">End Call</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let pc = null;
        let timerInterval, seconds = 0;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'QUEUED') {
                document.getElementById('statusText').innerText = `All agents busy. Queue position: ${data.position}`;
            }
            else if (data.type === 'CALL_CONNECTED') {
                document.getElementById('statusText').innerText = `Connected to ${data.agentId}!`;
                document.getElementById('callTimer').style.display = 'block';
                startTimer();

                setupWebRTC();
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'offer', offer }));
            }
            else if (data.type === 'answer') {
                if (!pc) return;
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
            else if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
            else if (data.type === 'HANGUP') {
                resetCall();
            }
        };

        async function setupWebRTC() {
            pc = new RTCPeerConnection(rtcConfig);
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                }
            };

            pc.ontrack = (e) => {
                document.getElementById('remoteAudio').srcObject = e.streams[0];
            };
        }

        function startTimer() {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                document.getElementById('callTimer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function resetCall() {
            clearInterval(timerInterval);
            if (pc) pc.close();
            pc = null;
            document.getElementById('callView').style.display = 'none';
            document.getElementById('formView').style.display = 'flex';
            document.getElementById('callTimer').style.display = 'none';
        }

        document.getElementById('callBtn').onclick = () => {
            const phoneNumber = document.getElementById('phoneInput').value.trim();
            if (!phoneNumber) {
                alert('Please enter your phone number.');
                return;
            }

            document.getElementById('formView').style.display = 'none';
            document.getElementById('callView').style.display = 'flex';
            document.getElementById('statusText').innerText = 'Finding available agent...';

            ws.send(JSON.stringify({ type: 'REGISTER_CUSTOMER', phoneNumber }));
        };

        document.getElementById('endBtn').onclick = () => {
            ws.send(JSON.stringify({ type: 'HANGUP' }));
            resetCall();
        };
    </script>
</body>
</html>
