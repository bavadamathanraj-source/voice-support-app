<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Support Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; height: 100vh; }
        .support-widget { position: fixed; bottom: 24px; right: 24px; width: 400px; height: 520px; background: #fff; border-radius: 20px; box-shadow: 0 12px 35px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
        .widget-header { background-color: #0f172a; color: #fff; padding: 24px; }
        .widget-body { padding: 24px; flex: 1; display: flex; flex-direction: column; gap: 16px; background: #f8fafc; }
        .phone-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; }
        .option-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .active-call-box { padding: 24px; text-align: center; background: #fff; flex: 1; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .timer { font-size: 36px; font-weight: 700; color: #22c55e; margin: 12px 0; }
        .btn-red { width: 100%; background: #ef4444; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="support-widget">
        <div class="widget-header">
            <h2>Support Center</h2>
            <p style="color: #94a3b8; font-size: 14px;">Instant Live Voice Channel</p>
        </div>

        <div class="widget-body" id="defaultView">
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 14px; font-weight: 600; color: #334155;">Your Phone Number</label>
                <input type="tel" id="customerPhone" class="phone-input" placeholder="+971 50 123 4567" />
            </div>

            <div class="option-card" id="callBtn">
                <div>
                    <h4 style="color: #0f172a;">Call Support Now</h4>
                    <p style="font-size: 13px; color: #64748b;">Connect directly to an agent</p>
                </div>
                <div style="font-size: 20px;">📞</div>
            </div>
        </div>

        <div class="active-call-box" id="callView">
            <h3 id="status" style="font-size: 16px; color: #0f172a;">Initiating Call...</h3>
            <p id="displayPhone" style="font-size: 14px; color: #64748b; margin-top: 4px;"></p>
            <div class="timer" id="callTimer" style="display: none;">00:00</div>
            <button id="endCallBtn" class="btn-red" style="margin-top: 20px;">End Call</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        const statusEl = document.getElementById('status');
        const defaultView = document.getElementById('defaultView');
        const callView = document.getElementById('callView');
        const callTimer = document.getElementById('callTimer');
        const customerPhoneInput = document.getElementById('customerPhone');
        const displayPhone = document.getElementById('displayPhone');

        let pc = null;
        let assignedAgentSocketId = null;
        let timerInterval, seconds = 0;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'QUEUED') {
                statusEl.innerText = `All agents busy. You are in queue (Position: ${data.position})`;
            }
            else if (data.type === 'CALL_DECLINED_REQUEUED') {
                statusEl.innerText = data.message;
            }
            else if (data.type === 'CALL_CONNECTED') {
                assignedAgentSocketId = data.agentSocketId;
                statusEl.innerText = `Connected to ${data.agentName}!`;
                callTimer.style.display = 'block';
                startTimer();

                // Setup WebRTC connection
                pc = new RTCPeerConnection(rtcConfig);
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        ws.send(JSON.stringify({
                            type: 'CANDIDATE',
                            targetId: assignedAgentSocketId,
                            candidate: e.candidate
                        }));
                    }
                };

                pc.ontrack = (e) => {
                    document.getElementById('remoteAudio').srcObject = e.streams[0];
                };

                // Create Offer specifically for assigned Agent
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({
                    type: 'OFFER',
                    targetId: assignedAgentSocketId,
                    offer: offer
                }));
            }
            else if (data.type === 'ANSWER') {
                if (!pc) return;
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
            else if (data.type === 'CANDIDATE' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
            else if (data.type === 'HANGUP') {
                resetCallState();
            }
        };

        function startTimer() {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                callTimer.innerText = `${m}:${s}`;
            }, 1000);
        }

        function resetCallState() {
            clearInterval(timerInterval);
            if (pc) pc.close();
            pc = null;
            callTimer.style.display = 'none';
            defaultView.style.display = 'flex';
            callView.style.display = 'none';
            displayPhone.innerText = '';
        }

        document.getElementById('callBtn').onclick = () => {
            const phoneNumber = customerPhoneInput.value.trim();
            if (!phoneNumber) {
                alert('Please enter your phone number first.');
                customerPhoneInput.focus();
                return;
            }

            defaultView.style.display = 'none';
            callView.style.display = 'flex';
            displayPhone.innerText = `Calling from: ${phoneNumber}`;
            statusEl.innerText = 'Routing call...';

            ws.send(JSON.stringify({ type: 'REGISTER_CUSTOMER', phoneNumber }));
        };

        document.getElementById('endCallBtn').onclick = () => {
            ws.send(JSON.stringify({ type: 'HANGUP' }));
            resetCallState();
        };
    </script>
</body>
</html>
